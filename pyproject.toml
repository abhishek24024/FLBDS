[project]
name = "flbds"
version = "0.1.0"
description = "FLBDS v3.0 - Functional and Logical Biomimetic Design System"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "scikit-learn>=1.4",
  "pillow>=10.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
vision = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.49", "accelerate>=0.30"]
gen = ["diffusers>=0.31", "cairosvg>=2.7"]
cad = ["cadquery>=2.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
flbds = "flbds.cli:app"

[tool.setuptools.packages.find]
include = ["flbds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore:.*shadows an attribute in parent.*:UserWarning"
]

[tool.ruff]
line-length = 100
target-version = "py311"
