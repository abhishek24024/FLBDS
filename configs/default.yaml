# FLBDS v3.0 Default Configuration

graphrag:
  alpha_txt: 0.65
  top_k: 20
  beam_width: 12
  max_depth: 4
  w_vec: 0.45
  w_causal: 0.30
  w_community: 0.15
  w_phylo: 0.10

extraction:
  strict_abductive: true
  require_evidence: true
  groundedness_threshold: 0.76
  max_followups: 3
  top_k_chunks: 8
  min_confidence: 0.0

scale:
  length_scale_min: 0.01
  length_scale_max: 1000.0
  error_on_violation: false

llm:
  provider: openai_compatible
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen2.5-72B-Instruct
  api_key_env: FLBDS_LLM_API_KEY
  temperature: 0.0
  max_tokens: 2048
  timeout_s: 120.0

vision:
  vlm_model: Qwen/Qwen2.5-VL-7B-Instruct
  sam_checkpoint: null
  device: cuda
  max_pixels: 1003520

synthesis:
  image_backend: reference
  svg_backend: geometry
  cad_backend: geometry
  guidance_scale: 30.0
  steps: 30
